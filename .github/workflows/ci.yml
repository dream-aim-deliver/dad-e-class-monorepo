name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: CI
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      # This enables task distribution via Nx Cloud
      # Run this command as early as possible, before dependencies are installed
      # Learn more at https://nx.dev/ci/reference/nx-cloud-cli#npx-nxcloud-startcirun
      # Uncomment this line to enable task distribution
      # - run: pnpm dlx nx-cloud start-ci-run --distribute-on="3 linux-medium-js" --stop-agents-after="e2e-ci"

      - name: Cache node_modules
        uses: actions/setup-node@v4
        with:
          node-version: 23
          cache: 'pnpm'

      - name: Install dependencies
        run: |
          cp .npmrc.template .npmrc
          sed -i "s/\$DAD_GH_NPM_TOKEN/${{ secrets.DAD_GH_NPM_TOKEN }}/g" .npmrc
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps

      - name: Set SHA for nx affected commands
        uses: nrwl/nx-set-shas@v4

      - name: Check Nx Sync
        run: ./tools/check-nx-sync.sh
        shell: bash

      - name: Lint
        run: pnpm exec nx run-many --no-cloud --skipNxCache -t lint --parallel=3
        env:
          'AUTH_SECRET': 'Wu/hegOKb+gqUY9pBZeLyZQLatMlZSWvK'
          'AUTH_ENABLE_TEST_ACCOUNTS': 'true'
          'AUTH_AUTH0_CLIENT_ID': ${{ secrets.AUTH_AUTH0_CLIENT_ID }}
          'AUTH_AUTH0_CLIENT_SECRET': ${{ secrets.AUTH_AUTH0_CLIENT_SECRET }}
          'AUTH_AUTH0_ISSUER': ${{ secrets.AUTH_AUTH0_ISSUER }}
          'AUTH_AUTH0_AUTHORIZATION_URL': ${{ secrets.AUTH_AUTH0_AUTHORIZATION_URL }}
          'NEXTAUTH_URL': 'https://example.com'
          'NEXTAUTH_SECRET': 'Wu/hegOKb+gqUY9pBZeLyZQLatMlZSWvK'
          'S3_HOSTNAME': 'localhost'
          'S3_PORT': '9000'
          'S3_PROTOCOL': 'http'
          'E_CLASS_DEV_MODE': 'true'

      # Retry absorbs Next 16 + next/font/google Turbopack flake when Google
      # Fonts occasionally returns extensionless /l/font?kit= URLs
      # (vercel/next.js#99114 → "queries have exactly one entry"). Fixed upstream
      # in Next >= 16.4.3; until that bump, 2 retries keep CI usable.
      - name: Build
        run: |
          set +e
          for attempt in 1 2 3; do
            echo "::group::Build attempt ${attempt}/3"
            pnpm exec nx run-many --no-cloud --skipNxCache -t build --parallel=1
            status=$?
            echo "::endgroup::"
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            echo "Build attempt ${attempt} failed with exit ${status}"
            if [ "$attempt" -lt 3 ]; then
              echo "Retrying in 10s (next/font/google flake)..."
              sleep 10
            fi
          done
          exit 1
        env:
          NODE_OPTIONS: '--max-old-space-size=2560'
          'AUTH_SECRET': 'Wu/hegOKb+gqUY9pBZeLyZQLatMlZSWvK'
          'AUTH_ENABLE_TEST_ACCOUNTS': 'true'
          'AUTH_AUTH0_CLIENT_ID': ${{ secrets.AUTH_AUTH0_CLIENT_ID }}
          'AUTH_AUTH0_CLIENT_SECRET': ${{ secrets.AUTH_AUTH0_CLIENT_SECRET }}
          'AUTH_AUTH0_ISSUER': ${{ secrets.AUTH_AUTH0_ISSUER }}
          'AUTH_AUTH0_AUTHORIZATION_URL': ${{ secrets.AUTH_AUTH0_AUTHORIZATION_URL }}
          'NEXTAUTH_URL': 'https://example.com'
          'NEXTAUTH_SECRET': 'Wu/hegOKb+gqUY9pBZeLyZQLatMlZSWvK'
          'S3_HOSTNAME': 'localhost'
          'S3_PORT': '9000'
          'S3_PROTOCOL': 'http'
          'E_CLASS_DEV_MODE': 'true'

      - name: Test
        run: pnpm exec nx run-many --no-cloud --skipNxCache -t test --parallel=2
        env:
          'AUTH_SECRET': 'Wu/hegOKb+gqUY9pBZeLyZQLatMlZSWvK'
          'AUTH_ENABLE_TEST_ACCOUNTS': 'true'
          'AUTH_AUTH0_CLIENT_ID': ${{ secrets.AUTH_AUTH0_CLIENT_ID }}
          'AUTH_AUTH0_CLIENT_SECRET': ${{ secrets.AUTH_AUTH0_CLIENT_SECRET }}
          'AUTH_AUTH0_ISSUER': ${{ secrets.AUTH_AUTH0_ISSUER }}
          'AUTH_AUTH0_AUTHORIZATION_URL': ${{ secrets.AUTH_AUTH0_AUTHORIZATION_URL }}
          'NEXTAUTH_URL': 'https://example.com'
          'NEXTAUTH_SECRET': 'Wu/hegOKb+gqUY9pBZeLyZQLatMlZSWvK'
          'S3_HOSTNAME': 'localhost'
          'S3_PORT': '9000'
          'S3_PROTOCOL': 'http'
          'E_CLASS_DEV_MODE': 'true'
